<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('操作未完成')}">
    <title>操作未完成 · 任务管理</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header('none')}"></header>

<main class="container">
    <section class="card state-card">
        <div class="state-icon" aria-hidden="true">!</div>
        <h1>操作未完成</h1>
        <p class="state-message"
           th:text="${error != null ? error : (message != null ? message : '请求处理失败，请稍后重试。')}">
            请求处理失败，请稍后重试。
        </p>
        <p class="state-meta" th:if="${status != null}">
            状态码：<span th:text="${status}">500</span>
        </p>
        <div class="state-actions">
            <a class="btn btn-primary" th:href="@{/task}" href="/task">返回任务列表</a>
            <a class="btn btn-ghost" th:href="@{/task(opt='add')}" href="/task?opt=add">新增任务</a>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
