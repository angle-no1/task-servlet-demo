<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('登录')}">
    <title>登录 · 任务管理</title>
</head>
<body class="login-body">
<main class="login-page">
    <section class="card login-card">
        <div class="login-brand">
            <span class="brand-mark" aria-hidden="true">T</span>
            <div>
                <h1>任务管理</h1>
                <p class="subtitle">TaskMaster · SpringBoot 现代化版</p>
            </div>
        </div>

        <div class="alert alert-success" role="status" th:if="${message}" th:text="${message}"></div>

        <form method="post" th:action="@{/login}" action="/login" th:object="${loginForm}">
            <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">用户名或密码错误</p>
            </div>

            <div class="field">
                <label for="loginName">登录名</label>
                <input id="loginName" type="text" required autofocus autocomplete="username"
                       placeholder="请输入登录名"
                       th:field="*{loginName}"
                       th:classappend="${#fields.hasErrors('loginName')} ? 'is-invalid'">
                <p class="field-error" th:if="${#fields.hasErrors('loginName')}"
                   th:errors="*{loginName}">请输入登录名</p>
            </div>

            <div class="field">
                <label for="loginPwd">密码</label>
                <input id="loginPwd" type="password" required autocomplete="current-password"
                       placeholder="请输入密码"
                       th:field="*{loginPwd}"
                       th:classappend="${#fields.hasErrors('loginPwd')} ? 'is-invalid'">
                <p class="field-error" th:if="${#fields.hasErrors('loginPwd')}"
                   th:errors="*{loginPwd}">请输入密码</p>
            </div>

            <button class="btn btn-primary login-submit" type="submit">登 录</button>
        </form>

        <p class="login-demo">
            演示账号：<code>admin</code> / <code>123456</code>
        </p>
        <p class="hint">
            未登录访问任务列表会被 <code>LoginInterceptor</code> 拦截并跳转到本页，登录成功后自动回到原地址。
        </p>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
