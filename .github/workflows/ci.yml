name: CI

# 环节一：Push / PR 触发 → 编译 → 单元测试（质量门禁）→ 打包 → 产物归档
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# 只读权限：CI 只验证与打包，不需要写仓库
permissions:
  contents: read

# 同一分支的新提交取消上一次未完成的流水线，节省 runner 资源
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: '-Dfile.encoding=UTF-8'

jobs:
  build-test-package:
    name: Build · Test · Package (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 质量门禁：任何测试失败都会让流水线红灯，后续打包步骤不会执行
      - name: Quality gate - mvn clean test
        run: mvn -B -ntp clean test

      # 构建可执行 JAR；测试已在上一步执行，这里跳过重复执行
      - name: Build artifact - mvn package
        run: mvn -B -ntp package -DskipTests

      # 防止“产物为空/名字变化”悄悄通过
      - name: Verify executable jar
        run: |
          test -f target/task-springboot.jar
          ls -lh target/task-springboot.jar

      # 产物归档：在 Actions 运行页可直接下载 task-springboot-jar
      - name: Upload executable jar
        uses: actions/upload-artifact@v4
        with:
          name: task-springboot-jar
          path: target/task-springboot.jar
          if-no-files-found: error
          retention-days: 7

      # 测试报告即使失败也上传，便于定位红灯用例
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
